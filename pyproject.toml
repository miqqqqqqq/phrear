[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "phrear"
dynamic = ["version"]
description = "Groundwater modelling platform for QGIS built on MODFLOW 6"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Michele" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]
# Runtime dependencies are managed by pixi from conda-forge (pixi.toml).
# Declaring them for pip installs is part of the distribution milestone (M6).
dependencies = []

[project.scripts]
phrear = "phrear.cli:main"

[tool.hatch.version]
path = "src/phrear/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/phrear"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "engine: tests that execute the MODFLOW 6 executable",
]
# Harmless ABI notice of cftime (used by netCDF4) built against an older numpy.
filterwarnings = ["ignore:numpy.ndarray size changed:RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "qgis_plugin", "scripts"]
extend-exclude = [".pixi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PTH"]

# Typographic characters used on purpose in user-facing texts.
allowed-confusables = ["×", "−", "’", "–"]

[tool.ruff.lint.per-file-ignores]
# QGIS requires classFactory, initGui and camelCase Qt overrides
"qgis_plugin/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "qgis_plugin", "scripts"]
mypy_path = "src:qgis_plugin:scripts"

# Libraries without type information: their objects are typed as Any.
[[tool.mypy.overrides]]
module = ["geopandas.*", "pyogrio.*", "shapely.*", "rasterio.*", "flopy.*", "xugrid.*", "qgis.*"]
ignore_missing_imports = true
